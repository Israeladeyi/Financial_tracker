<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Graphic Design Finance Tracker</h1>
    </header>

    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="summary">
                <div>
                    <h3>Total Income</h3>
                    <p id="total-income">$0.00</p>
                </div>
                <div>
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">$0.00</p>
                </div>
                <div>
                    <h3>Net Profit</h3>
                    <p id="net-profit">$0.00</p>
                </div>
            </div>
            <div id="chart-container">
                <canvas id="finance-chart"></canvas>
            </div>
        </section>

        <section id="add-transaction">
            <h2>Add New Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="transaction-type">Type:</label>
                    <select id="transaction-type" name="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div id="income-fields">
                    <div class="form-group">
                        <label for="client-name">Client Name:</label>
                        <input type="text" id="client-name" name="clientName">
                    </div>
                    <div class="form-group">
                        <label for="project-name">Project Name:</label>
                        <input type="text" id="project-name" name="projectName">
                    </div>
                     <div class="form-group">
                        <label for="is-paid">Paid:</label>
                        <input type="checkbox" id="is-paid" name="isPaid">
                    </div>
                </div>

                <div id="expense-fields" class="hidden">
                    <div class="form-group">
                        <label for="expense-category">Category:</label>
                        <input type="text" id="expense-category" name="category" placeholder="e.g., Software, Hardware">
                    </div>
                    <div class="form-group">
                        <label for="item-name">Item Name:</label>
                        <input type="text" id="item-name" name="itemName">
                    </div>
                </div>

                <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" name="amount" required step="0.01">
                </div>
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section id="transactions-list">
            <h2>Transactions</h2>
            <div class="filter-container">
                <label for="filter-start-date">From:</label>
                <input type="date" id="filter-start-date">
                <label for="filter-end-date">To:</label>
                <input type="date" id="filter-end-date">
                <button id="filter-button">Filter</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transaction-table-body">
                    <!-- Rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
